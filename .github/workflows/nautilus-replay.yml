name: Nautilus v2 isolated replay

on:
  push:
    branches: [integration/nautilus-v2-replay]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-native-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install separate research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'nautilus_trader==2.0.0rc7'
          python -m pip check
      - name: Run parser/provenance contracts
        run: python -m unittest discover -s tests -p 'test_nautilus_bridge.py' -v
      - name: Run actual Nautilus backtest event engine
        run: python -m unittest discover -s tests_nautilus -p 'test_native_replay.py' -v
