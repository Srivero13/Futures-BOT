name: Nautilus offline integration
on:
  push:
    branches: [develop, integration/nautilus-offline]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  offline-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-nautilus-lock.txt
      - run: python -m pip install -r requirements-nautilus-lock.txt
      - run: python -m unittest discover -s tests_nautilus -v
      - run: python -m integrations.nautilus.control --output data/nautilus-control.json
