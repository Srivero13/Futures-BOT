name: Offline regression tests

on:
  push:
    branches: [develop, main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned CPU dependencies
        id: dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline startup checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          python doctor.py --output-dir "$RUNNER_TEMP/bot-doctor" | tee test-results/doctor.json
      - name: Run complete CPU test suite
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          python -m unittest discover -s tests -v 2>&1 | tee test-results/unittest.log
      - name: Retain diagnostic output
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
